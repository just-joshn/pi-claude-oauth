name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release-version: ${{ steps.version.outputs.release-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Check release version
        id: version
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          previous=$(git show "$BASE_SHA:package.json" | jq -er '.version')
          version=$(jq -er '.version' package.json)
          stable='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $stable ]]; then
            echo "::error::package.json must use a stable MAJOR.MINOR.PATCH version"
            exit 1
          fi
          if [[ "$version" == "$previous" ]]; then
            exit 0
          fi
          if [[ "$(printf '%s\n' "$previous" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "::error::package.json version must increase"
            exit 1
          fi
          printf 'release-version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - name: Pack npm tarball
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package"
      - name: Upload release tarball
        if: github.event_name == 'push' && steps.version.outputs.release-version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

  publish:
    name: Stage on npm
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'just-joshn/pi-claude-oauth' && needs.verify.outputs.release-version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish the verified tarball
        env:
          VERSION: ${{ needs.verify.outputs.release-version }}
        run: |
          name=pi-claude-oauth
          tarball="$RUNNER_TEMP/npm-package/$name-$VERSION.tgz"
          test -f "$tarball"
          versions=$(npm view "$name" versions --json --prefer-online)
          if jq -e --arg version "$VERSION" 'index($version) != null' <<< "$versions" >/dev/null; then
            published=$(npm view "$name@$VERSION" dist.integrity --prefer-online)
            expected="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
            if [[ "$published" != "$expected" ]]; then
              echo "::error::$name@$VERSION already exists on npm with different contents"
              exit 1
            fi
            echo "$name@$VERSION is already published with matching integrity"
          else
            npm stage publish "$tarball" --ignore-scripts --provenance --access public
            echo "::notice::Approve $name@$VERSION with 2FA on npmjs.com or with npm stage approve to publish it"
          fi

  github-release:
    name: Create GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.verify.outputs.release-version }}
        run: |
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq '.[].ref')
          if grep -Fxq "refs/tags/$TAG" <<< "$refs"; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq '.sha')
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG points to $target, expected $GITHUB_SHA"
              exit 1
            fi
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
