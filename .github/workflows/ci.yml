name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22.23.5'
          - os: ubuntu-24.04
            node: '24.22.3'
          - os: ubuntu-24.04
            node: '26.13.1'
            primary: true
          - os: macos-15
            node: '26.13.1'
          - os: windows-2025
            node: '26.13.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.20.0
      - name: Install dependencies
        run: npm ci --ignore-scripts --include=dev --no-audit
      - name: Lint, format, and typecheck
        if: matrix.primary == true
        run: npm run check
      - name: Test with coverage
        if: matrix.primary == true
        run: npm run test:coverage
      - name: Test compatibility
        if: matrix.primary != true
        run: npm test
      - name: Audit dependencies
        if: matrix.primary == true
        run: npm run audit
      - name: Inspect package
        if: matrix.primary == true
        run: npm run pack:check
      - name: Install and load packed extension
        run: npm run test:package

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history
        run: |
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/path \
            -v "$PWD:/path:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --ignore-gitleaks-allow --log-opts="--all" /path
