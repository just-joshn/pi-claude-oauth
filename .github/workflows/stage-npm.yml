name: Stage npm

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'just-joshn/pi-claude-oauth' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select release version
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version | select(type == "string")' package.json)
          if [[ "$EVENT_NAME" == push ]]; then
            if [[ ! "$BEFORE" =~ ^[a-f0-9]{40}$ ]] ||
              ! previous=$(git show "$BEFORE:package.json" 2>/dev/null | jq -er '.version | select(type == "string" and length > 0)'); then
              echo '::notice::Previous package version unavailable. Use Run workflow on main to recover.'
              exit 0
            fi
            if [[ "$version" == "$previous" ]]; then
              echo 'Package version unchanged; skipping staging.'
              exit 0
            fi
          elif [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            exit 1
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Expected a stable package version (major.minor.patch).'
            exit 1
          fi
          jq -e --arg version "$version" '.version == $version and .packages[""].version == $version' package-lock.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: candidate
    if: needs.candidate.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.20.0
      - name: Install dependencies
        run: npm ci --ignore-scripts --include=dev --no-audit
      - name: Lint, format, and typecheck
        run: npm run check
      - name: Test with coverage
        run: npm run test:coverage
      - name: Audit dependencies
        run: npm run audit
      - name: Inspect package
        run: npm run pack:check
      - name: Pack and smoke-test the release tarball
        id: pack
        env:
          EXPECTED_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          set -euo pipefail
          release=$(mktemp -d "$RUNNER_TEMP/npm-release.XXXXXXXX")
          npm pack --ignore-scripts --pack-destination "$release"
          tarball="$release/pi-claude-oauth-$EXPECTED_VERSION.tgz"
          tar -xOf "$tarball" package/package.json | jq -e --arg version "$EXPECTED_VERSION" \
            '.name == "pi-claude-oauth" and .version == $version'
          digest=$(sha256sum "$tarball" | cut -d ' ' -f 1)
          npm run test:package -- "$tarball"
          printf '%s  %s\n' "$digest" "$tarball" | sha256sum --check --strict
          printf 'tarball=%s\nsha256=%s\n' "$tarball" "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidate
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  secrets:
    needs: candidate
    if: needs.candidate.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history
        run: |
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/path \
            -v "$PWD:/path:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --ignore-gitleaks-allow --log-opts="--all" /path

  stage:
    name: Stage on npm
    needs: [candidate, verify, secrets]
    if: github.repository == 'just-joshn/pi-claude-oauth' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-staging
    permissions:
      id-token: write
    concurrency:
      group: npm-stage-${{ needs.candidate.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.20.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-candidate
          path: ${{ runner.temp }}/npm-candidate
      - name: Verify digest and stage for npm approval
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/npm-candidate/pi-claude-oauth-$VERSION.tgz"
          printf '%s  %s\n' "$SHA256" "$tarball" | sha256sum --check --strict
          npm stage publish "$tarball" --ignore-scripts --registry=https://registry.npmjs.org
